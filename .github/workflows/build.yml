name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    # Jarvis is a Windows-only app (WPF, WinForms, System.Speech), so it can only
    # be fully compiled and verified on a Windows runner.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore JARVIS.IRL.sln

      - name: Build
        run: dotnet build JARVIS.IRL.sln --configuration Release --no-restore
